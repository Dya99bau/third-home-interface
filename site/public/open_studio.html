// ── Actions ───────────────────────────────────────────────────────────────────
function setMode(m){mode=m;if(m==='viewer')selectedTool=null;if(m==='editor')closeMatPicker();render()}
function setView(v){view=v;render()}
function setFloor(f){floor=f;selectedTool=null;render()}
function togLayer(fi){layerVis[fi]=!layerVis[fi];render()}
function selTool(t){selectedTool=selectedTool===t?null:t;selectedEl=null;render()}
function clickEl(id,ev){
  if(ev)ev.stopPropagation();
  // Iso view: show action popup instead of sidebar selection
  if(view==='iso'){
    const el=placed.find(e=>e.id===id);
    if(el) showIsoAction(ev,{kind:'placed',...el});
    return;
  }
  if(selectedTool)return;
  selectedEl=selectedEl===id?null:id;
  if(selectedEl){const el=placed.find(e=>e.id===id);if(el&&mode==='editor')floor=el.floor;}
  render();
}
function delEl(id){placed=placed.filter(e=>e.id!==id);selectedEl=null;toast('Element removed');render()}

function clickBookable(c,r,ev){
  if(ev)ev.stopPropagation();
  // Iso view: always route through the action popup
  if(view==='iso'){showIsoAction(ev,{kind:'bookable',c,r});return;}
  // Floor 2 editor (plan view): toggle staging for assembly animation
  if(mode==='editor'&&floor===2){stageFloor2Cell(c,r);return;}
  if(mode==='editor'&&selectedTool){
    if(placed.some(e=>e.c===c&&e.r===r&&e.floor===floor)){toast('Cell occupied!');return;}
    const et=ETYPES[selectedTool];
    placed.push({id:`el${idCtr++}`,type:selectedTool,floor,c,r,label:et.label});
    render();
    return;
  }
  modalCell={c,r};
  openModal(c,r);
}

// ── Iso Action Panel ──────────────────────────────────────────────────────────
function showIsoAction(ev,data){
  hideIsoAction();
  isoAction=data;
  const bk=data.kind==='bookable'?bookings[`${data.c},${data.r}`]:null;
  let html=`<div class="ia-hd">`;
  if(data.kind==='placed')
    html+=`<span style="font-size:18px;margin-right:6px">${ETYPES[data.type]?.icon||'◈'}</span>${data.label} · ${FCFG[data.floor].name}`;
  else
    html+=`Cell [${data.c},${data.r}]${bk?` · <span style="color:#4A9ED6">booked</span>`:''}`;
  html+=`</div>`;
  if(data.kind==='placed'){
    html+=`<button class="ia-btn ia-del" onclick="isoDoDelete()">🗑 Remove element</button>`;
  } else {
    if(mode==='editor'&&selectedTool)
      html+=`<button class="ia-btn ia-add" onclick="isoDoPlace()">＋ Place ${ETYPES[selectedTool]?.label||selectedTool}</button>`;
    html+=`<button class="ia-btn ia-book" onclick="isoDoBook()">📋 ${bk?'Update booking':'Book space'}</button>`;
    if(bk)
      html+=`<button class="ia-btn ia-del" onclick="isoDoRelease()">🗑 Delete booking</button>`;
  }
  html+=`<button class="ia-btn ia-cancel" onclick="hideIsoAction()">✕ Close</button>`;
  const p=document.getElementById('iso-action');
  p.innerHTML=html;
  p.style.left=Math.min(ev.clientX+14,window.innerWidth-178)+'px';
  p.style.top=Math.min(ev.clientY-8,window.innerHeight-160)+'px';
  p.classList.add('show');
}
function hideIsoAction(){document.getElementById('iso-action').classList.remove('show');isoAction=null;}
function isoDoDelete(){if(isoAction?.kind==='placed')delEl(isoAction.id);else hideIsoAction();}
function isoDoPlace(){
  if(!isoAction||!selectedTool){hideIsoAction();return;}
  const{c,r}=isoAction;
  if(placed.some(e=>e.c===c&&e.r===r&&e.floor===floor)){toast('Cell occupied!');hideIsoAction();return;}
  placed.push({id:`el${idCtr++}`,type:selectedTool,floor,c,r,label:ETYPES[selectedTool].label});
  hideIsoAction();render();
}
function isoDoBook(){
  if(!isoAction){hideIsoAction();return;}
  const{c,r}=isoAction;hideIsoAction();modalCell={c,r};openModal(c,r);
}
function isoDoRelease(){
  if(!isoAction) return;
  const key=`${isoAction.c},${isoAction.r}`;
  delete bookings[key];
  toast('Booking deleted');
  hideIsoAction();render();
}

// ── Floor 2 Assembly Animation ────────────────────────────────────────────────
function stageFloor2Cell(c,r){
  const key=`${c},${r}`;
  if(floor2Stage.has(key)) floor2Stage.delete(key);
  else floor2Stage.add(key);
  render();
}
function clearFloor2Stage(){
  floor2Stage.clear(); buildAnim=null; render();
}
function startAssembly(){
  if(!floor2Stage.size){toast('Stage some cells first');return;}
  // Build animation cell list staggered by diagonal (c+r)
  const cells=[...floor2Stage].map(key=>{
    const [c,r]=key.split(',').map(Number);
    return {c,r,key,delay:(c+r)*280}; // stagger by diagonal, 280ms per step
  });
  const minD=Math.min(...cells.map(x=>x.delay));
  cells.forEach(x=>x.delay-=minD);
  const maxD=Math.max(...cells.map(x=>x.delay));
  // Book all staged cells with assembled teal color, flag as floor2
  cells.forEach(({key})=>{
    bookings[key]={status:'customized',color:'rgba(0,200,170,1)',note:'Assembled',floor2:true};
  });
  buildAnim={cells,startTime:performance.now(),totalDuration:1800+maxD}; // walls(900)+roof(520+680)=wall finishes at 900, roof finishes at 1200
  // Switch to viewer iso, floor 2
  mode='viewer'; view='iso'; floor=2;
  render();
  requestAnimationFrame(animFrame);
  toast('Assembling…');
}
function animFrame(now){
  if(!buildAnim) return;
  render();
  if(now-buildAnim.startTime < buildAnim.totalDuration){
    requestAnimationFrame(animFrame);
  } else {
    buildAnim=null;
    floor2Stage.clear();
    render();
    toast('Assembly complete!');
    setTimeout(showMatPicker, 400);
  }
}

// ── Material Picker (Floor 2 post-assembly) ───────────────────────────────────
function showMatPicker(){
  clearTimeout(peekTimer);
  matPickerSel=null; matPickerPreview=null;
  const assembledCount=Object.values(bookings).filter(b=>b.floor2).length;
  const p=document.getElementById('mat-picker');
  p.className=''; // clear peek/semi/confirm classes so mpIn animation replays
  p.innerHTML=`
    <div class="mp-hd">Choose wall &amp; roof material</div>
    <div class="mp-sub">${assembledCount} unit${assembledCount!==1?'s':''} · Floor 2 · <span style="color:rgba(100,200,255,.7)">hover to preview</span></div>
    <div class="mp-cards">
      ${Object.entries(F2_MATERIALS).map(([key,m])=>`
        <div class="mat-card" id="mc-${key}"
          onmouseenter="prevMat('${key}')"
          onmouseleave="onCardLeave()"
          onclick="selMat('${key}')">
          <div class="mat-icon">${m.icon}</div>
          <div class="mat-name">${m.label}</div>
          <div class="mat-sub2">${m.sub}</div>
          <div class="mat-swatch" style="background:${m.swatchBg};border:1.5px solid ${m.bdr}"></div>
        </div>`).join('')}
    </div>
    <div id="mp-preview-bar" style="font-size:13px;font-family:monospace;color:rgba(255,255,255,.3);min-height:18px;text-align:center;letter-spacing:.04em;transition:all .22s">
      Hover a card to preview live on your units
    </div>
    <div class="mp-footer">
      <button class="mp-later" onclick="closeMatPicker()">Cancel</button>
      <button class="mp-apply" id="mp-apply-btn" disabled onclick="applyMaterial()" style="opacity:.35;transform:scale(.97)">✓ Confirm Material</button>
    </div>`;
  p.style.display='flex';
  render();
}

function prevMat(key){
  clearTimeout(peekTimer);
  matPickerPreview=key||null;
  const p=document.getElementById('mat-picker');

  if(key&&F2_MATERIALS[key]){
    // Step 1: fade the picker away so the user sees the canvas
    p.classList.add('mp-peek');
    p.classList.remove('mp-semi','mp-confirm');

    // Step 2: auto-return after 1.1s — slide back at semi opacity
    peekTimer=setTimeout(()=>{
      p.classList.remove('mp-peek');
      p.classList.add('mp-semi');
      updatePreviewBar();
    }, 1100);
  } else {
    // No hover target — restore fully
    p.classList.remove('mp-peek','mp-semi');
    updatePreviewBar();
  }
  render();
}

function onCardLeave(){
  // Called when mouse leaves a card: revert preview to current selection
  matPickerPreview=matPickerSel;
  clearTimeout(peekTimer);
  const p=document.getElementById('mat-picker');
  p.classList.remove('mp-peek','mp-semi');
  updatePreviewBar();
  render();
}

function updatePreviewBar(){
  const bar=document.getElementById('mp-preview-bar');
  if(!bar) return;
  if(matPickerPreview&&matPickerPreview!==matPickerSel&&F2_MATERIALS[matPickerPreview]){
    const m=F2_MATERIALS[matPickerPreview];
    bar.innerHTML=`<span style="color:rgba(130,200,255,.8)">Previewing</span> <b style="color:#D0E4FF">${m.label}</b> — click to select`;
  } else if(matPickerSel&&F2_MATERIALS[matPickerSel]){
    const m=F2_MATERIALS[matPickerSel];
    bar.innerHTML=`<span style="color:rgba(100,220,160,.8)">Selected</span> <b style="color:#D0E4FF">${m.label}</b> · click <b>Confirm</b> to apply`;
  } else {
    bar.innerHTML='Hover a card to preview live on your units';
  }
}

function selMat(key){
  clearTimeout(peekTimer);
  matPickerSel=key; matPickerPreview=key;
  // Bring picker back fully with confirm highlight
  const p=document.getElementById('mat-picker');
  p.classList.remove('mp-peek','mp-semi');
  p.classList.add('mp-confirm');
  document.querySelectorAll('.mat-card').forEach(c=>c.classList.remove('sel'));
  document.getElementById('mc-'+key).classList.add('sel');
  const btn=document.getElementById('mp-apply-btn');
  btn.disabled=false;
  btn.style.opacity='1';
  btn.style.transform='scale(1)';
  btn.style.background='rgba(60,180,120,.88)';
  updatePreviewBar();
  render();
}

function closeMatPicker(){
  clearTimeout(peekTimer);
  const p=document.getElementById('mat-picker');
  p.style.display='none';
  p.classList.remove('mp-peek','mp-semi','mp-confirm');
  matPickerSel=null; matPickerPreview=null;
  render();
}
function applyMaterial(){
  if(!matPickerSel) return;
  const mat=F2_MATERIALS[matPickerSel];
  Object.keys(bookings).forEach(key=>{
    if(bookings[key].floor2) bookings[key].material=matPickerSel;
  });
  closeMatPicker();
  render();
  toast(`${mat.label} applied to ${Object.values(bookings).filter(b=>b.floor2).length} units`);
  setTimeout(roofDeployAll, 600);
}

// ── Booking Modal ─────────────────────────────────────────────────────────────
function openModal(c,r){
  const key=`${c},${r}`, bk=bookings[key];
  document.getElementById('modal-title').textContent=`Cell [${c}, ${r}]`;
  document.getElementById('modal-sub').textContent=`${c*CM}–${(c+1)*CM}m × ${r*CM}–${(r+1)*CM}m · ${bk?bk.status:'available'}`;
  const curColor=bk?.color||modalPickColor;
  if(bk?.icon) modalPickIcon=bk.icon;
  const curIcon=modalPickIcon;
  let body='';
  if(floor===0){
    body+=`<div style="font-size:14px;color:rgba(255,255,255,.4);margin-bottom:8px;font-family:monospace">Choose a program icon:</div>`;
    body+=`<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:14px">`;
    body+=GROUND_ICONS.map(ico=>`<div class="icon-dot${ico===curIcon?' sel':''}" onclick="pickIcon('${ico}')">${ico}</div>`).join('');
    body+=`</div>`;
  }
  body+=`<div style="font-size:14px;color:rgba(255,255,255,.4);margin-bottom:10px;font-family:monospace">
    ${bk?'Update booking color:':'Choose a color for your space:'}
  </div>
  <div class="color-grid">${MODAL_COLORS.map(c2=>`<div class="color-dot${c2===curColor?' sel':''}" style="background:${c2}" onclick="pickColor('${c2}')"></div>`).join('')}</div>`;
  if(bk){
    body+=`<div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07)">
      <button class="del-btn" onclick="releaseBooking(${c},${r})">🗑 Delete booking</button>
    </div>`;
  }
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-action').textContent=bk?'Update':'Book Cell';
  document.getElementById('book-modal').classList.add('show');
}
function pickColor(c){
  modalPickColor=c;
  document.querySelectorAll('.color-dot').forEach(d=>{
    const bg=d.style.background;
    d.classList.toggle('sel',bg===c||bg===hexToRgb(c));
  });
}
function pickIcon(ico){
  modalPickIcon=ico;
  document.querySelectorAll('.icon-dot').forEach(d=>{d.classList.toggle('sel',d.textContent===ico);});
}
function hexToRgb(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return `rgb(${r}, ${g}, ${b})`}
function modalAction(){
  if(!modalCell)return;
  const{c,r}=modalCell;const key=`${c},${r}`;const bk=bookings[key];
  const ico=floor===0?modalPickIcon:undefined;
  if(!bk){bookings[key]={status:'customized',color:modalPickColor,...(ico&&{icon:ico})};toast(`Cell [${c},${r}] booked!`);}
  else if(bk.status==='customized'){bk.color=modalPickColor;if(ico)bk.icon=ico;toast('Booking updated!');}
  else{delete bookings[key];toast(`Cell [${c},${r}] released`);}
  closeModal();render();
}
function closeModal(){document.getElementById('book-modal').classList.remove('show');modalCell=null;}
function releaseBooking(c,r){delete bookings[`${c},${r}`];toast('Booking deleted');closeModal();render();}

function resetView(){isoAz=28;isoZoom=1;panX=0;panY=0;render()}
function saveDesign(){
  const blob=new Blob([JSON.stringify({placed,bookings,layers:layerVis},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='open-studio.json';a.click();
  toast('Design exported!');
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200)}

// ── Drag / Zoom ───────────────────────────────────────────────────────────────
(function(){
  const area=document.getElementById('canvas-area');
  let drag=null;
  area.addEventListener('mousedown',e=>{if(e.button!==0)return;drag={sx:e.clientX,sy:e.clientY,az:isoAz,px:panX,py:panY,ctrl:e.ctrlKey||e.metaKey}});
  window.addEventListener('mousemove',e=>{
    if(!drag)return;
    const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(view==='iso'){if(drag.ctrl){panX=drag.px+dx;panY=drag.py+dy;}else{isoAz=drag.az+dx*.35;panY=drag.py+dy;}}
    else{panX=drag.px+dx;panY=drag.py+dy;}
    render();
  });
  window.addEventListener('mouseup',()=>{drag=null});
  area.addEventListener('wheel',e=>{e.preventDefault();isoZoom=Math.max(.25,Math.min(7,isoZoom*(e.deltaY<0?1.1:1/1.1)));render()},{passive:false});
  area.addEventListener('click',e=>{if(e.target===area||e.target.tagName==='svg'){hideIsoAction();if(!selectedTool){selectedEl=null;render();}}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideIsoAction();closeModal();}});
  document.getElementById('book-modal').addEventListener('click',e=>{if(e.target===document.getElementById('book-modal'))closeModal()});
})();

window.addEventListener('resize',render);
render();
</script>

<div id="mat-picker" style="display:none"></div>
</body>
