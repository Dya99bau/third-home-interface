<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Studio — Wolfsburg</title>
<link href="./fonts/inter.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:#060C18;color:#E0E8F4;display:flex;flex-direction:column;height:100vh;font-size:16px}

#header{display:flex;align-items:center;gap:12px;padding:11px 22px;background:#080E1C;border-bottom:1px solid rgba(59,130,197,.2);flex-shrink:0;flex-wrap:wrap}
.logo{font-family:Georgia,serif;font-size:28px;font-weight:700;color:#4A9ED6;letter-spacing:.06em;white-space:nowrap}
.logo span{color:rgba(255,255,255,.22);font-size:16px;font-weight:400;margin-left:9px}
.sep{width:1px;height:30px;background:rgba(255,255,255,.09);flex-shrink:0}
.hdr-lbl{font-size:13px;font-family:monospace;color:rgba(255,255,255,.2);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.pill-group{display:flex;background:rgba(255,255,255,.04);border-radius:8px;padding:3px;gap:2px}
.pill{padding:6px 16px;border-radius:6px;border:none;font-size:14px;font-family:monospace;letter-spacing:.06em;cursor:pointer;font-weight:600;text-transform:uppercase;white-space:nowrap;transition:all .15s}
.pill.active{background:rgba(59,130,197,.8);color:#F0F7FF}
.pill:not(.active){background:transparent;color:rgba(255,255,255,.3)}
.pill:not(.active):hover{color:rgba(255,255,255,.65)}
.floor-btn{padding:6px 15px;border-radius:6px;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.35);font-size:14px;font-family:monospace;cursor:pointer;transition:all .2s;white-space:nowrap;font-weight:600}
.spacer{flex:1}
.act-btn{padding:6px 16px;border-radius:6px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:rgba(255,255,255,.45);font-size:14px;font-family:monospace;cursor:pointer;transition:all .15s}
.act-btn:hover{border-color:rgba(59,130,197,.5);color:rgba(255,255,255,.85)}

#main{flex:1;display:flex;overflow:hidden}
.sidebar{width:230px;background:#070D1A;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
#sb-left{border-right:1px solid rgba(59,130,197,.1)}
#sb-right{border-left:1px solid rgba(59,130,197,.1)}
.s-sec{padding:14px;border-bottom:1px solid rgba(59,130,197,.06)}
.s-ttl{font-size:20px;font-family:monospace;color:rgba(255,255,255,.18);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}

.eitem{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:6px;cursor:pointer;transition:all .13s;margin-bottom:3px;border:1px solid transparent;font-size:16px;color:rgba(255,255,255,.45)}
.eitem:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.12)}
.eitem.active-tool{border-color:currentColor}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.stat-box{background:rgba(255,255,255,.03);border-radius:6px;padding:9px 11px}
.stat-v{font-size:20px;font-weight:700;font-family:monospace;color:#4A9ED6;line-height:1}
.stat-s{font-size:13px;color:rgba(255,255,255,.22);margin-top:4px}
.prop-row{margin-bottom:11px}
.prop-l{font-size:13px;color:rgba(255,255,255,.25);font-family:monospace;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.prop-v{font-size:16px;color:#B8CEFA;font-family:monospace}
.prop-vl{font-size:16px;font-weight:700;color:#DDE8FF;font-family:monospace}
.del-btn{width:100%;padding:9px;border-radius:6px;border:1px solid rgba(197,80,59,.35);background:rgba(197,80,59,.07);color:rgba(220,120,100,.85);font-size:14px;font-family:monospace;cursor:pointer;transition:all .14s;margin-top:6px}
.del-btn:hover{background:rgba(197,80,59,.2);color:#F09080}

.swatch-row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px;font-family:monospace;color:rgba(255,255,255,.35)}
.swatch{width:14px;height:14px;border-radius:3px;flex-shrink:0}
.swatch.dashed{background:transparent;border:1.5px dashed currentColor}

.layer-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;cursor:pointer}
.layer-nm{font-size:14px;color:rgba(255,255,255,.4);display:flex;align-items:center;gap:7px}
.lsw{width:32px;height:17px;border-radius:9px;border:none;cursor:pointer;position:relative;transition:background .14s;flex-shrink:0}
.lsw::after{content:'';position:absolute;width:13px;height:13px;border-radius:50%;background:white;top:2px;transition:left .14s}
.lsw.on{background:rgba(59,130,197,.8)}.lsw.on::after{left:17px}
.lsw.off{background:rgba(255,255,255,.14)}.lsw.off::after{left:2px}

#canvas-area{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 55%,rgba(15,35,70,.45) 0%,#060C18 68%)}
#main-svg{display:block}

#bottom-bar{border-top:1px solid rgba(59,130,197,.1);padding:7px 20px;display:flex;gap:18px;font-size:13px;font-family:monospace;color:rgba(255,255,255,.18);background:#050B15;flex-shrink:0;letter-spacing:.05em;flex-wrap:wrap}
#bottom-bar span{display:flex;gap:4px;align-items:center}

#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(59,130,197,.92);color:white;padding:9px 22px;border-radius:20px;font-size:16px;opacity:0;transition:all .28s;pointer-events:none;white-space:nowrap;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#iso-action{position:fixed;background:#0A1022;border:1px solid rgba(59,130,197,.38);border-radius:10px;padding:13px 14px;min-width:190px;z-index:45;display:none;box-shadow:0 6px 28px rgba(0,0,0,.65)}
#iso-action.show{display:block}
.ia-hd{font-size:14px;font-family:monospace;color:rgba(255,255,255,.42);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.07);line-height:1.4}
.ia-btn{display:block;width:100%;padding:8px 11px;border-radius:6px;font-size:14px;font-family:monospace;cursor:pointer;text-align:left;margin-bottom:5px;transition:all .13s}
.ia-add{background:rgba(59,130,197,.18);color:rgba(130,195,255,.9);border:1px solid rgba(59,130,197,.38)}
.ia-add:hover{background:rgba(59,130,197,.36)}
.ia-del{background:rgba(197,80,59,.15);color:rgba(235,130,110,.9);border:1px solid rgba(197,80,59,.32)}
.ia-del:hover{background:rgba(197,80,59,.32)}
.ia-book{background:rgba(255,255,255,.05);color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.1)}
.ia-book:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.85)}
.ia-cancel{background:transparent;color:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.06);margin-bottom:0}
.ia-cancel:hover{color:rgba(255,255,255,.5)}

#book-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;align-items:center;justify-content:center}
#book-modal.show{display:flex}
.modal-box{background:#0B1120;border:1px solid rgba(59,130,197,.3);border-radius:14px;padding:28px;min-width:340px;max-width:460px}
.modal-title{font-size:20px;font-weight:700;color:#D0E4FF;margin-bottom:5px}
.modal-sub{font-size:16px;color:rgba(255,255,255,.3);font-family:monospace;margin-bottom:18px}
.modal-btn{padding:10px 24px;border-radius:8px;border:none;cursor:pointer;font-size:16px;font-family:monospace;font-weight:600;transition:all .14s}
.modal-btn.primary{background:rgba(59,130,197,.85);color:white}
.modal-btn.primary:hover{background:#2196F3}
.modal-btn.ghost{background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.12)}
.modal-btn.ghost:hover{color:rgba(255,255,255,.8)}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}
.color-dot{width:30px;height:30px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:all .12s}
.color-dot.sel{border-color:white;transform:scale(1.15)}
.icon-dot{width:36px;height:36px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all .12s;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(255,255,255,.06)}

#mat-picker{position:fixed;bottom:54px;left:50%;transform:translateX(-50%);background:#070D1A;border:1px solid rgba(59,130,197,.38);border-radius:16px;padding:24px 28px 18px;z-index:46;flex-direction:column;align-items:center;gap:14px;box-shadow:0 12px 48px rgba(0,0,0,.75);animation:mpIn .38s cubic-bezier(.22,.68,0,1.2);transition:opacity .40s cubic-bezier(.4,0,.2,1),transform .40s cubic-bezier(.4,0,.2,1)}
@keyframes mpIn{from{opacity:0;transform:translateX(-50%) translateY(24px) scale(.96)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
#mat-picker.mp-peek{opacity:.05;transform:translateX(-50%) translateY(22px) scale(.96);pointer-events:none}
#mat-picker.mp-semi{opacity:.60;transform:translateX(-50%) translateY(6px) scale(.99)}
#mat-picker.mp-confirm{border-color:rgba(80,220,160,.7);box-shadow:0 12px 48px rgba(0,0,0,.75),0 0 28px rgba(60,200,140,.22)}
.mp-hd{font-size:20px;font-weight:700;color:#D0E4FF;text-align:center}
.mp-sub{font-size:14px;color:rgba(255,255,255,.28);font-family:monospace;margin-top:-6px;text-align:center}
.mp-cards{display:flex;gap:11px}
.mat-card{width:136px;padding:18px 14px 14px;border-radius:11px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);cursor:pointer;transition:all .18s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px}
.mat-card:hover{background:rgba(59,130,197,.13);border-color:rgba(100,180,255,.65);transform:translateY(-2px);box-shadow:0 0 14px rgba(59,130,197,.28)}
.mat-card.sel{border-color:rgba(80,220,160,.9);background:rgba(60,180,120,.18);box-shadow:0 0 18px rgba(60,200,140,.25)}
.mat-icon{font-size:30px;line-height:1}
.mat-name{font-size:14px;font-weight:600;color:#D0E4FF}
.mat-sub2{font-size:11px;color:rgba(255,255,255,.3);font-family:monospace;line-height:1.4;text-align:center}
.mat-swatch{width:100%;height:7px;border-radius:4px;margin-top:2px}
.mp-footer{display:flex;align-items:center;justify-content:space-between;width:100%;padding-top:8px;border-top:1px solid rgba(255,255,255,.07)}
.mp-apply{padding:9px 28px;border-radius:8px;border:none;background:rgba(59,130,197,.85);color:white;font-size:14px;font-family:monospace;font-weight:700;cursor:pointer;transition:all .14s}
.mp-apply:hover{background:#2196F3}
.mp-later{background:transparent;color:rgba(255,255,255,.25);border:none;cursor:pointer;font-size:13px;font-family:monospace;padding:4px 10px;border-radius:6px}
.mp-later:hover{color:rgba(255,255,255,.55)}
.icon-dot.sel{border-color:white;background:rgba(255,255,255,.18);transform:scale(1.15)}
.icon-dot:hover{background:rgba(255,255,255,.12)}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(59,130,197,.18);border-radius:2px}
</style>
</head>
<body>

<div id="header">
  <div class="logo">OPEN STUDIO<span>Wolfsburg</span></div>
  <div class="sep"></div>
  <span class="hdr-lbl">MODE</span>
  <div class="pill-group">
    <button class="pill" data-mode="editor" onclick="setMode('editor')">◈ Editor</button>
    <button class="pill active" data-mode="viewer" onclick="setMode('viewer')">◎ Viewer</button>
  </div>
  <div class="sep"></div>
  <span class="hdr-lbl">VIEW</span>
  <div class="pill-group">
    <button class="pill active" data-view="iso" onclick="setView('iso')">⬡ Isometric</button>
    <button class="pill" data-view="plan" onclick="setView('plan')">⊞ Plan</button>
  </div>
  <div class="sep" id="fsep"></div>
  <span class="hdr-lbl" id="flbl">FLOOR</span>
  <button class="floor-btn" data-floor="0" onclick="setFloor(0)">G</button>
  <button class="floor-btn" data-floor="1" onclick="setFloor(1)">+1</button>
  <button class="floor-btn" data-floor="2" onclick="setFloor(2)">+2</button>
  <div class="spacer"></div>
  <button class="act-btn" onclick="resetView()">Reset View</button>
  <button class="act-btn" onclick="saveDesign()">Export JSON</button>
</div>

<div id="main">
  <div class="sidebar" id="sb-left"></div>
  <div id="canvas-area"><svg id="main-svg"></svg></div>
  <div class="sidebar" id="sb-right"></div>
</div>

<div id="bottom-bar">
  <span>SITE <b style="color:rgba(255,255,255,.38)">25 × 25 m</b></span>
  <span>GRID <b style="color:rgba(255,255,255,.38)">5 × 5 @ 5 m</b></span>
  <span>FIXED CORE <b style="color:rgba(255,255,255,.38)">10 × 10 m · [1,1]→[2,2]</b></span>
  <span>FIXED CORE <b style="color:rgba(255,255,255,.38)">Floors G · +1 · +2</b></span>
  <span id="st-coord" style="margin-left:auto"></span>
  <span id="st-sel"></span>
</div>
<div id="toast"></div>
<div id="iso-action"></div>

<div id="book-modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Cell [0,0]</div>
    <div class="modal-sub" id="modal-sub">5m × 5m · Available</div>
    <div id="modal-body"></div>
    <div style="display:flex;gap:8px;margin-top:18px;justify-content:flex-end">
      <button class="modal-btn ghost" onclick="closeModal()">Cancel</button>
      <button class="modal-btn primary" id="modal-action" onclick="modalAction()">Book Cell</button>
    </div>
  </div>
</div>

<script>
// ── Constants ────────────────────────────────────────────────────────────────
const GN = 5, CM = 5, FH = 4, NF = 3;
const FL = ['G','+1','+2'];

// Ground floor kitchen = 3×3 center (cross-plan layout, image-derived)
const CORE_CELLS = [
  [1,1],[2,1],[3,1],
  [1,2],[2,2],[3,2],
  [1,3],[2,3],[3,3]
];
// Ground floor: same 3×3 kitchen core
const GROUND_CORE_CELLS = [
  [1,1],[2,1],[3,1],
  [1,2],[2,2],[3,2],
  [1,3],[2,3],[3,3]
];
// Ground floor: only 4 corners are void — all other non-kitchen cells are bookable
const GROUND_EMPTY_CELLS = [[0,0],[4,0],[0,4],[4,4]];

// fi-aware: F0=cross kitchen · F1=full 5×5 stay rooms · F2=all 25 cells bookable (deployable)
function isCore(c,r,fi=floor){
  if(fi===0) return GROUND_CORE_CELLS.some(([cc,cr])=>cc===c&&cr===r);
  if(fi===1) return true;  // all 25 constant stay rooms
  if(fi===2) return false; // no fixed core — every cell is bookable/deployable
  return CORE_CELLS.some(([cc,cr])=>cc===c&&cr===r);
}
const EMPTY_CELLS = [[0,0],[4,0],[0,4],[4,4]];
function isEmpty(c,r,fi=floor){
  if(fi===0) return GROUND_EMPTY_CELLS.some(([cc,cr])=>cc===c&&cr===r);
  if(fi===1||fi===2) return false; // no void cells on floors 1 & 2
  return EMPTY_CELLS.some(([cc,cr])=>cc===c&&cr===r);
}
function isBookable(c,r){return !isCore(c,r)&&!isEmpty(c,r)}

// ── Floor Color System ───────────────────────────────────────────────────────
// Rule: hue = floor identity · lightness = space type
// fixed spaces  = dark/strong (30-40% L)
// addable spaces = light/soft  (85-92% L), dashed outline
const FCFG = [
  {
    // Ground Floor — Orange hue
    name:'Ground Floor', sub:'Community Kitchen',
    hue: 'orange',
    col:'#FF9800',                          // identity color (mid)
    // Fixed / constant spaces
    fixedBg:   'rgba(191,54,12,.82)',       // dark orange fill
    fixedBdr:  '#E64A19',                   // dark orange border
    fixedZone: 'rgba(230,81,0,.6)',         // zone dividers
    // Addable / deployable spaces
    addFill:   'rgba(255,243,224,.28)',     // very light orange
    addBorder: '#FF9800',                   // orange dashed
    addIcon:   'rgba(255,152,0,.7)',        // "+" color
    addLabel:  'rgba(255,183,77,.8)',
    // Iso 3D face colors
    isoTop: 'rgba(255,152,0,.72)',
    isoXf:  'rgba(198,100,0,.78)',
    isoYf:  'rgba(148,62,0,.82)',
    isoAddTop:'rgba(255,243,224,.55)',
    isoAddXf: 'rgba(255,220,150,.22)',
    isoAddYf: 'rgba(240,200,120,.18)',
  },
  {
    // First Floor — Blue hue
    name:'First Floor', sub:'Stay Rooms',
    hue: 'blue',
    col:'#2196F3',
    fixedBg:   'rgba(13,71,161,.82)',
    fixedBdr:  '#1565C0',
    fixedZone: 'rgba(21,101,192,.6)',
    addFill:   'rgba(227,242,253,.28)',
    addBorder: '#2196F3',
    addIcon:   'rgba(33,150,243,.75)',
    addLabel:  'rgba(100,181,246,.85)',
    isoTop: 'rgba(33,150,243,.7)',
    isoXf:  'rgba(21,100,200,.76)',
    isoYf:  'rgba(10,55,165,.82)',
    isoAddTop:'rgba(227,242,253,.55)',
    isoAddXf: 'rgba(180,220,255,.22)',
    isoAddYf: 'rgba(150,200,250,.18)',
  },
  {
    // Second Floor — Purple hue
    name:'Second Floor', sub:'Deployable Rooftop',
    hue: 'purple',
    col:'#9C27B0',
    fixedBg:   'rgba(74,20,140,.82)',
    fixedBdr:  '#6A1B9A',
    fixedZone: 'rgba(106,27,154,.6)',
    addFill:   'rgba(243,229,245,.28)',
    addBorder: '#9C27B0',
    addIcon:   'rgba(156,39,176,.75)',
    addLabel:  'rgba(206,147,216,.85)',
    isoTop: 'rgba(156,39,176,.7)',
    isoXf:  'rgba(106,27,154,.76)',
    isoYf:  'rgba(60,0,110,.82)',
    isoAddTop:'rgba(243,229,245,.55)',
    isoAddXf: 'rgba(220,180,235,.22)',
    isoAddYf: 'rgba(195,148,215,.18)',
  },
];

// ── Floor core renderers (derived directly from floor plan images) ───────────

// Ground Floor: individual white cells in cross pattern — exact from floor plan image
function drawCore0(o, OX, OY, CS) {
  GROUND_CORE_CELLS.forEach(([c,r]) => {
    const px = OX + c*CS, py = OY + (GN-1-r)*CS;
    o += `<rect x="${px+1}" y="${py+1}" width="${CS-2}" height="${CS-2}" fill="rgba(255,255,255,.93)" stroke="rgba(190,190,190,.55)" stroke-width="1.2" rx="2"/>`;
  });
  // Label centred on middle cell [2,2]
  const cx = OX + 2*CS + CS/2, cy = OY + (GN-1-2)*CS + CS/2;
  o += `<text x="${cx}" y="${cy-20}" text-anchor="middle" fill="rgba(0,0,0,.72)" font-size="8" font-family="sans-serif" font-weight="600" pointer-events="none">all white units are Kitchen</text>`;
  o += `<text x="${cx}" y="${cy-10}" text-anchor="middle" fill="rgba(0,0,0,.6)"  font-size="7" font-family="sans-serif" pointer-events="none">working space</text>`;
  o += `<text x="${cx}" y="${cy+1}"  text-anchor="middle" fill="rgba(0,0,0,.48)" font-size="7" font-family="sans-serif" pointer-events="none">including cooking area,</text>`;
  o += `<text x="${cx}" y="${cy+11}" text-anchor="middle" fill="rgba(0,0,0,.48)" font-size="7" font-family="sans-serif" pointer-events="none">preparation, storage and</text>`;
  o += `<text x="${cx}" y="${cy+21}" text-anchor="middle" fill="rgba(0,0,0,.48)" font-size="7" font-family="sans-serif" pointer-events="none">seating</text>`;
  return o;
}

// First Floor: full 5×5 grid — all 25 cells are constant stay rooms (exact from image)
function drawCore1(o, OX, OY, CS) {
  for(let r=0;r<GN;r++) for(let c=0;c<GN;c++){
    const px=OX+c*CS, py=OY+(GN-1-r)*CS;
    o+=`<rect x="${px+1}" y="${py+1}" width="${CS-2}" height="${CS-2}" fill="rgba(255,255,255,.92)" stroke="#CC2222" stroke-width="1.2" rx="2"/>`;
  }
  // Label centred in the full grid (matching image text placement)
  const cx=OX+GN*CS/2, cy=OY+GN*CS/2;
  o+=`<text x="${cx}" y="${cy-6}" text-anchor="middle" fill="rgba(0,0,0,.72)" font-size="8" font-family="sans-serif" font-weight="600" pointer-events="none">stay rooms with servies</text>`;
  o+=`<text x="${cx}" y="${cy+6}" text-anchor="middle" fill="rgba(0,0,0,.6)"  font-size="7" font-family="sans-serif" pointer-events="none">and toilet full white units</text>`;
  return o;
}

// Second Floor: full 5×5 checkerboard — white AND grey both deployable (exact from image)
function drawCore2(o, OX, OY, CS) {
  for(let r=0;r<GN;r++) for(let c=0;c<GN;c++){
    const px=OX+c*CS, py=OY+(GN-1-r)*CS;
    const grey=(c+r)%2===0;
    const fill=grey?'rgba(110,110,110,.78)':'rgba(255,255,255,.92)';
    o+=`<rect x="${px+1}" y="${py+1}" width="${CS-2}" height="${CS-2}" fill="${fill}" stroke="#CC2222" stroke-width="1.2" rx="2"/>`;
  }
  const cx=OX+GN*CS/2, cy=OY+GN*CS/2;

const MAT_IMGS = {
  tensile_fabric:  IMG_TENSILE,
  insulated_panel: IMG_INSULATED,

// Generate SVG pattern defs scaled to isometric zoom (5m wall face, 5m roof face)
function matPatternDefs(){
  const rad=isoAz*Math.PI/180, C=Math.sqrt(3)/2;
  const wallW=Math.max(18, Math.round(isoZoom*14*CM*Math.sin(rad)*C*2.05));
  const wallH=Math.max(20, Math.round(isoZoom*14*FH));
  const roofW=Math.max(30, Math.round(isoZoom*14*CM*(Math.cos(rad)+Math.sin(rad))*C*1.18));
  const roofH=Math.max(18, Math.round(isoZoom*14*CM*(Math.cos(rad)+Math.sin(rad))*0.52));
  let d='';
  for(const [k,src] of Object.entries(MAT_IMGS)){
    d+='<pattern id="pw-'+k+'" width="'+wallW+'" height="'+wallH+'" patternUnits="userSpaceOnUse"><image href="'+src+'" x="0" y="0" width="'+wallW+'" height="'+wallH+'" preserveAspectRatio="xMidYMid slice"/></pattern>';
    d+='<pattern id="pr-'+k+'" width="'+roofW+'" height="'+roofH+'" patternUnits="userSpaceOnUse"><image href="'+src+'" x="0" y="0" width="'+roofW+'" height="'+roofH+'" preserveAspectRatio="xMidYMid slice"/></pattern>';
  }
  return d;
}

// ── Iso math ──────────────────────────────────────────────────────────────────
function ip(col,row,zM){
  const rad=isoAz*Math.PI/180;
  const wx=col*CM, wy=row*CM;
  const rx=wx*Math.cos(rad)-wy*Math.sin(rad);
  const ry=wx*Math.sin(rad)+wy*Math.cos(rad);
  const C=Math.sqrt(3)/2, S=0.5;
  const W=document.getElementById('canvas-area').clientWidth;
  const H=document.getElementById('canvas-area').clientHeight;
  return [W/2+panX+isoZoom*14*C*(rx-ry), H*.56+panY+isoZoom*14*(S*(rx+ry)-zM)];
}
function pts(arr){return arr.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(' ')}

// ── PLAN VIEW ─────────────────────────────────────────────────────────────────
function renderPlan(svg,W,H){
  const CS=Math.min(Math.floor((Math.min(W,H)-100)/GN),110);
  const OX=(W-GN*CS)/2, OY=(H-GN*CS)/2;
  const ppm=CS/CM;
  let o=`<defs><filter id="iconGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="${W}" height="${H}" fill="#060C18"/>`;

  // outer border
  o+=`<rect x="${OX}" y="${OY}" width="${GN*CS}" height="${GN*CS}" fill="rgba(255,255,255,.012)" stroke="rgba(59,130,197,.3)" stroke-width="1.5" rx="2"/>`;

  const inEditor=mode==='editor';
  const cfg=FCFG[floor];

  // ── Cells: empty corners dark · bookable arm cells · skip core ───────────────
  for(let r=0;r<GN;r++) for(let c=0;c<GN;c++){
    const px=OX+c*CS, py=OY+(GN-1-r)*CS;

    if(isEmpty(c,r)){
      // Corner cells — part of site but outside building footprint, show as void
      o+=`<rect x="${px}" y="${py}" width="${CS}" height="${CS}" fill="rgba(0,0,0,.45)" rx="2"/>`;
      continue;
    }
    if(isCore(c,r)) continue; // drawn separately below

    // Addition space (arm cell)
    const key=`${c},${r}`;
    const bk=bookings[key];
    let fill, stroke, strokeW='1.2', dash='', label='', labelCol;
    if(floor===2&&floor2Stage.has(key)){
      fill='rgba(0,200,170,.45)'; stroke='rgba(0,220,190,.88)'; strokeW='2'; dash=''; label='✓'; labelCol='rgba(0,240,210,1)';
    } else if(bk&&bk.status==='customized'){
      fill=bk.color+'38'; stroke=bk.color; strokeW='1.8';
      label='BOOKED'; labelCol=bk.color;
    } else if(inEditor){
      fill=cfg.addFill; stroke=cfg.addBorder; dash='6,4'; labelCol=cfg.addIcon;
      label='+';
    } else if(floor===2){
      // Checkerboard: grey = structural grid · white = deployable unit slot
      const isGrey2=(c+r)%2===0;
      fill=isGrey2?'rgba(110,110,110,.78)':'rgba(255,255,255,.88)';
      stroke='#CC2222'; strokeW='1.2'; label=''; labelCol='transparent';
    } else {
      fill='rgba(255,255,255,.04)'; stroke='rgba(59,130,197,.22)'; labelCol='rgba(59,130,197,.32)';
      label='+';
    }

    o+=`<rect x="${px+1}" y="${py+1}" width="${CS-2}" height="${CS-2}"
      fill="${fill}" stroke="${stroke}" stroke-width="${strokeW}"
      ${dash?`stroke-dasharray="${dash}"`:''}
      rx="3" style="cursor:pointer"
      onclick="clickBookable(${c},${r},event)"
      onmouseenter="hov('Addition space [${c},${r}] · ${bk?bk.status:'available'} · ${c*CM}–${(c+1)*CM}m, ${r*CM}–${(r+1)*CM}m')"
      onmouseleave="hov('')"/>`;

    if(bk&&bk.status==='customized'){
      if(floor===0&&inEditor&&bk.icon){
        const icx=px+CS/2, icy=py+CS/2;
        const r1=CS*.28, r2=CS*.40, r3=CS*.52;
        // Soft glow halo
        o+=`<circle cx="${icx}" cy="${icy}" r="${r1}" fill="${bk.color}20" pointer-events="none"/>`;
        // Three pulsing concentric rings
        o+=`<circle cx="${icx}" cy="${icy}" r="${r1*.5}" fill="${bk.color}12" stroke="${bk.color}aa" stroke-width="1.2" pointer-events="none"><animate attributeName="r" values="${r1*.5};${r1}" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="1.8s" repeatCount="indefinite"/></circle>`;
        o+=`<circle cx="${icx}" cy="${icy}" r="${r2*.5}" fill="none" stroke="${bk.color}66" stroke-width="1" pointer-events="none"><animate attributeName="r" values="${r2*.5};${r2}" dur="1.8s" begin="0.45s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="1.8s" begin="0.45s" repeatCount="indefinite"/></circle>`;
        o+=`<circle cx="${icx}" cy="${icy}" r="${r3*.5}" fill="none" stroke="${bk.color}44" stroke-width=".7" pointer-events="none"><animate attributeName="r" values="${r3*.5};${r3}" dur="1.8s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/></circle>`;
        // Big icon with glow filter
        o+=`<text x="${icx}" y="${icy}" text-anchor="middle" dominant-baseline="middle" font-size="${Math.round(CS*.36)}" pointer-events="none" filter="url(#iconGlow)">${bk.icon}</text>`;
      } else {
        o+=`<rect x="${px+CS/2-14}" y="${py+5}" width="28" height="10" rx="3" fill="${bk.color}cc"/>`;
        o+=`<text x="${px+CS/2}" y="${py+12}" text-anchor="middle" fill="white" font-size="7" font-family="monospace" font-weight="700" pointer-events="none">BOOKED</text>`;
      }
    } else {
      o+=`<text x="${px+CS/2}" y="${py+CS/2+4}" text-anchor="middle" dominant-baseline="middle" fill="${labelCol}" font-size="13" font-family="monospace" font-weight="700" pointer-events="none">${label}</text>`;
      if(inEditor&&CS>55){
        o+=`<text x="${px+CS/2}" y="${py+CS-7}" text-anchor="middle" fill="${cfg.addBorder}55" font-size="7" font-family="monospace" pointer-events="none">ADD</text>`;
      }
    }
  }

  // ── Fixed core background (3×3, cols 1–3, rows 1–3) ───────────────────────
  const coreX=OX+1*CS, coreY=OY+(GN-1-3)*CS;
  const coreW=3*CS,    coreH=3*CS;

  // ── Floor 0: Kitchen — individual cross cells, exact from floor plan image ──
  if(layerVis[0]){
    const dim=inEditor&&floor!==0?0.3:1;
    o+=`<g opacity="${dim}">`;
    o=drawCore0(o, OX, OY, CS);
    o+=`</g>`;
  }

  // ── Floor 1: Stay Rooms — full 5×5 grid, all constant, from image ───────────
  if(layerVis[1]){
    const dim=inEditor&&floor!==1?0.3:1;
    o+=`<g opacity="${dim}">`;
    o=drawCore1(o, OX, OY, CS);
    o+=`</g>`;
  }

  // ── Floor 2: no fixed core — all 25 cells are bookable (rendered in cell loop) ─


  // ── Placed elements ────────────────────────────────────────────────────────
  placed.forEach(el=>{
    if(!layerVis[el.floor]) return;
    const fcfg=FCFG[el.floor];
    const px=OX+el.c*CS, py=OY+(GN-1-el.r)*CS;
    const sel=selectedEl===el.id;
    const dim=inEditor&&floor!==el.floor?0.3:1;
    o+=`<g opacity="${dim}" onclick="clickEl('${el.id}',event)" style="cursor:pointer"
      onmouseenter="hov('${el.label} [${el.c},${el.r}] · ${fcfg.name}')" onmouseleave="hov('')">`;
    o+=`<rect x="${px+2}" y="${py+2}" width="${CS-4}" height="${CS-4}" fill="${fcfg.fixedBg}" stroke="${sel?'white':fcfg.col}" stroke-width="${sel?2.5:1.5}" rx="4"/>`;
    o+=`<text x="${px+CS/2}" y="${py+CS/2+2}" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="16" pointer-events="none">${ETYPES[el.type]?.icon||''}</text>`;
    if(CS>60) o+=`<text x="${px+CS/2}" y="${py+CS-7}" text-anchor="middle" fill="rgba(255,255,255,.55)" font-size="7" font-family="monospace" pointer-events="none">${el.label}</text>`;
    o+=`</g>`;
  });

  // ── Grid lines ─────────────────────────────────────────────────────────────
  for(let i=0;i<=GN;i++){
    o+=`<line x1="${OX+i*CS}" y1="${OY}" x2="${OX+i*CS}" y2="${OY+GN*CS}" stroke="rgba(59,130,197,.25)" stroke-width=".7"/>`;
    o+=`<line x1="${OX}" y1="${OY+i*CS}" x2="${OX+GN*CS}" y2="${OY+i*CS}" stroke="rgba(59,130,197,.25)" stroke-width=".7"/>`;
    if(i<GN){
      o+=`<text x="${OX+i*CS+CS/2}" y="${OY-7}" text-anchor="middle" fill="rgba(59,130,197,.4)" font-size="8" font-family="monospace">${i}</text>`;
      o+=`<text x="${OX-8}" y="${OY+(GN-1-i)*CS+CS/2}" text-anchor="end" dominant-baseline="middle" fill="rgba(59,130,197,.4)" font-size="8" font-family="monospace">${i}</text>`;
    }
  }
  o+=`<text x="${OX+GN*CS/2}" y="${OY+GN*CS+17}" text-anchor="middle" fill="rgba(59,130,197,.38)" font-size="8" font-family="monospace">← ${GN*CM} m →</text>`;

  // ── Scale bar ──────────────────────────────────────────────────────────────
  const sbx=OX, sby=OY+GN*CS+30;
  o+=`<line x1="${sbx}" y1="${sby}" x2="${sbx+CS}" y2="${sby}" stroke="rgba(59,130,197,.45)" stroke-width="1.5"/>`;
  [`${sbx}`,`${sbx+CS}`].forEach(x=>{o+=`<line x1="${x}" y1="${sby-4}" x2="${x}" y2="${sby+4}" stroke="rgba(59,130,197,.45)" stroke-width="1.5"/>`;});
  o+=`<text x="${sbx+CS/2}" y="${sby+12}" text-anchor="middle" fill="rgba(59,130,197,.5)" font-size="8" font-family="monospace">5 m</text>`;

  // ── Legend ─────────────────────────────────────────────────────────────────
  let lx=OX+GN*CS+14, ly=OY;
  o+=`<text x="${lx}" y="${ly-2}" fill="rgba(255,255,255,.15)" font-size="7" font-family="monospace" letter-spacing="1">LEGEND</text>`;
  ly+=10;
  FCFG.forEach((f,fi)=>{
    o+=`<rect x="${lx}" y="${ly}" width="10" height="10" rx="2" fill="${f.fixedBg}"/>`;
    o+=`<text x="${lx+14}" y="${ly+8}" fill="rgba(255,255,255,.4)" font-size="8" font-family="monospace">${f.name}</text>`;
    ly+=15;
    // addable swatch
    o+=`<rect x="${lx}" y="${ly}" width="10" height="10" rx="2" fill="${f.addFill}" stroke="${f.addBorder}" stroke-width="1" stroke-dasharray="3,2"/>`;
    o+=`<text x="${lx+14}" y="${ly+8}" fill="rgba(255,255,255,.28)" font-size="7" font-family="monospace">↳ Addable (Fl.${fi})</text>`;
    ly+=17;
  });
  ly+=3;
  o+=`<rect x="${lx}" y="${ly}" width="10" height="10" rx="2" fill="#DC143C"/>`;
  o+=`<text x="${lx+14}" y="${ly+8}" fill="rgba(255,255,255,.4)" font-size="8" font-family="monospace">Red Steel</text>`;

  // ── Red steel column dots (plan cross-section) ─────────────────────────────
  {
    const colSet=new Set();
    for(let r=0;r<GN;r++) for(let c=0;c<GN;c++){
      if(isEmpty(c,r,floor)) continue;
      if(!isCore(c,r,floor)&&bookings[`${c},${r}`]?.status!=='customized') continue;
      [[c,r],[c+1,r],[c,r+1],[c+1,r+1]].forEach(([gc,gr])=>colSet.add(`${gc},${gr}`));
    }
    const cr2=Math.max(3,Math.round(CS*0.058));
    colSet.forEach(k=>{
      const [gc,gr]=k.split(',').map(Number);
      const sx=OX+gc*CS, sy=OY+(GN-gr)*CS;
      o+=`<circle cx="${sx}" cy="${sy}" r="${cr2}" fill="#CC1111" pointer-events="none"/>`;
      o+=`<circle cx="${sx-cr2*.28}" cy="${sy-cr2*.28}" r="${cr2*.35}" fill="rgba(255,210,210,.75)" pointer-events="none"/>`;
    });
  }

  svg.innerHTML=o;
}

// ── ISOMETRIC VIEW ───────────────────────────────────────────────────────────
function renderIso(svg,W,H){
  const inEditor=mode==='editor';
  const rnd=!inEditor; // rendered (viewer) mode — clean materials, directional light
  // Floor-specific glass palettes for rendered mode (amber · blue · mint)
  const GLASS=[
    {top:'rgba(255,195,95,.24)',xf:'rgba(195,130,35,.42)',yf:'rgba(165,105,25,.48)',bdr:'rgba(255,220,140,.85)',spec:'rgba(255,248,200,.24)'},
    {top:'rgba(130,200,255,.24)',xf:'rgba(50,125,225,.42)',yf:'rgba(30,105,205,.48)',bdr:'rgba(165,218,255,.85)',spec:'rgba(215,238,255,.24)'},
    {top:'rgba(120,255,195,.24)',xf:'rgba(30,185,120,.42)',yf:'rgba(15,160,100,.48)',bdr:'rgba(165,255,215,.85)',spec:'rgba(195,255,228,.24)'},
  ];

  // ── Background ────────────────────────────────────────────────────────────
  let o=rnd
    ?`<defs>
        <linearGradient id="bgRnd" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0D1825"/>
          <stop offset="50%" stop-color="#1A2E48"/>
          <stop offset="100%" stop-color="#243858"/>
        </linearGradient>
        ${matPatternDefs()}
      </defs>
      <rect width="${W}" height="${H}" fill="url(#bgRnd)"/>`
    :`<defs><filter id="isoIconGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="${W}" height="${H}" fill="#060C18"/>`;

  // ── Ground plane ──────────────────────────────────────────────────────────
  const gp=[[0,0,0],[GN,0,0],[GN,GN,0],[0,GN,0]].map(([c,r,z])=>ip(c,r,z));
  o+=rnd
    ?`<polygon points="${pts(gp)}" fill="#1C2E42" stroke="rgba(80,140,200,.22)" stroke-width="0.8"/>`
    :`<polygon points="${pts(gp)}" fill="rgba(5,11,22,.9)" stroke="rgba(59,130,197,.5)" stroke-width="1.5"/>`;
  for(let i=0;i<=GN;i++){
    const a=ip(i,0,0),b=ip(i,GN,0);
    if(!rnd) o+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="rgba(59,130,197,.2)" stroke-width=".6"/>`;
    const c=ip(0,i,0),d=ip(GN,i,0);
    if(!rnd) o+=`<line x1="${c[0].toFixed(1)}" y1="${c[1].toFixed(1)}" x2="${d[0].toFixed(1)}" y2="${d[1].toFixed(1)}" stroke="rgba(59,130,197,.2)" stroke-width=".6"/>`;
  }

  const rad=isoAz*Math.PI/180;
  function dep(c,r,fi){return (c+.5)*CM*Math.cos(rad)+(r+.5)*CM*Math.sin(rad)+fi*.01}

  // Build render items
  let items=[];
  // Bookable cells — one stack per cell per floor (fi-aware for cross footprint)
  for(let fi=0;fi<NF;fi++){
    if(!layerVis[fi]) continue;
    for(let r=0;r<GN;r++) for(let c=0;c<GN;c++){
      if(isCore(c,r,fi)||isEmpty(c,r,fi)) continue;
      items.push({kind:'bookable',c,r,fi,d:dep(c,r,fi)});
    }
  }
  // Placed elements
  placed.forEach(el=>{
    if(!layerVis[el.floor]) return;
    items.push({kind:'placed',el,d:dep(el.c,el.r,el.floor)});
  });
  // Red steel column segments — one per (corner, floor)
  for(let fi=0;fi<NF;fi++){
    if(!layerVis[fi]) continue;
    const colSet=new Set();
    for(let r=0;r<GN;r++) for(let c=0;c<GN;c++){
      if(isEmpty(c,r,fi)) continue;
      if(!isCore(c,r,fi)&&bookings[`${c},${r}`]?.status!=='customized') continue;
      [[c,r],[c+1,r],[c,r+1],[c+1,r+1]].forEach(([gc,gr])=>colSet.add(`${gc},${gr},${fi}`));
    }
    colSet.forEach(k=>{
      const [gc,gr,fii]=k.split(',').map(Number);
      items.push({kind:'column',gc,gr,fi:fii,d:gc*CM*Math.cos(rad)+gr*CM*Math.sin(rad)+fii*.01});
    });
  }
  items.sort((a,b)=>a.d-b.d);

  items.forEach(item=>{
    if(item.kind==='bookable'){
      const {c,r,fi}=item;
      const fcfg=FCFG[fi];
      const bk=bookings[`${c},${r}`];
      const fzB=fi*FH, fzT=fzB+FH;

      // ── Floor 2 assembly animation: all 4 walls slide in from sides, roof drops ─
      if(fi===2&&buildAnim){
        const ca=buildAnim.cells.find(x=>x.c===c&&x.r===r);
        if(ca){
          const easeOut=t=>1-Math.pow(1-Math.max(0,Math.min(1,t)),2);
          const elapsed=performance.now()-buildAnim.startTime-ca.delay;
          const wallP=Math.max(0,easeOut(elapsed/900));
          const wallH=FH*wallP;
          const slide=(1-wallP)*1.8;   // grid units: 1.8→0 as walls snap in
          const roofP=easeOut(Math.max(0,elapsed-520)/680);
          const fzRoofA=fzT+(1-roofP)*5.5;
          const opacity=Math.max(0,Math.min(1,elapsed/80));
          const dimA=(inEditor&&floor!==fi?0.22:1)*opacity;
          const topFillA='rgba(105,232,215,.34)';
          const xFillA  ='rgba(44,168,155,.50)';
          const yFillA  ='rgba(68,190,175,.44)';
          const sideA   ='rgba(68,190,175,.30)';
          const borderA ='rgba(145,242,228,.82)';
          o+=`<g opacity="${dimA}" onclick="clickBookable(${c},${r},event)" style="cursor:pointer"
            onmouseenter="hov('[${c},${r}] ${fcfg.name} · ${bk?bk.status:'available'}')" onmouseleave="hov('')">`;
          // Floor base (static)
          o+=`<polygon points="${pts([ip(c,r,fzB),ip(c+1,r,fzB),ip(c+1,r+1,fzB),ip(c,r+1,fzB)])}" fill="rgba(4,10,20,.85)"/>`;
          // Far wall  — row=r+1 face, slides in from +row direction
          const fr_=r+1+slide;
          o+=`<polygon points="${pts([ip(c,fr_,fzB),ip(c+1,fr_,fzB),ip(c+1,fr_,fzB+wallH),ip(c,fr_,fzB+wallH)])}" fill="${sideA}" stroke="${borderA}" stroke-width=".5"/>`;
          // Left wall  — col=c face, slides in from -col direction
          const lc_=c-slide;
          o+=`<polygon points="${pts([ip(lc_,r,fzB),ip(lc_,r+1,fzB),ip(lc_,r+1,fzB+wallH),ip(lc_,r,fzB+wallH)])}" fill="${yFillA}" stroke="${borderA}" stroke-width=".6"/>`;
          // Right wall — col=c+1 face, slides in from +col direction
          const rc_=c+1+slide;
          o+=`<polygon points="${pts([ip(rc_,r,fzB),ip(rc_,r+1,fzB),ip(rc_,r+1,fzB+wallH),ip(rc_,r,fzB+wallH)])}" fill="${xFillA}" stroke="${borderA}" stroke-width=".6"/>`;
          // Near wall  — row=r face, slides in from -row direction
          const nr_=r-slide;
          o+=`<polygon points="${pts([ip(c,nr_,fzB),ip(c+1,nr_,fzB),ip(c+1,nr_,fzB+wallH),ip(c,nr_,fzB+wallH)])}" fill="${sideA}" stroke="${borderA}" stroke-width=".5"/>`;
          // Roof panel drops from above
          const rfA=[ip(c,r,fzRoofA),ip(c+1,r,fzRoofA),ip(c+1,r+1,fzRoofA),ip(c,r+1,fzRoofA)];
          o+=`<polygon points="${pts(rfA)}" fill="${topFillA}" stroke="${borderA}" stroke-width="1.4"/>`;
          // Specular highlight on roof panel
          const rmx=(rfA[0][0]+rfA[1][0]+rfA[2][0]+rfA[3][0])/4, rmy=(rfA[0][1]+rfA[1][1]+rfA[2][1]+rfA[3][1])/4;
          o+=`<polygon points="${rfA[0][0].toFixed(1)},${rfA[0][1].toFixed(1)} ${((rfA[0][0]+rfA[1][0])/2).toFixed(1)},${((rfA[0][1]+rfA[1][1])/2).toFixed(1)} ${rmx.toFixed(1)},${rmy.toFixed(1)} ${((rfA[0][0]+rfA[3][0])/2).toFixed(1)},${((rfA[0][1]+rfA[3][1])/2).toFixed(1)}" fill="rgba(255,255,255,.24)" pointer-events="none"/>`;
          if(bk&&bk.status==='customized'){
            const cx2=rmx, cy2=rmy;
            o+=`<text x="${cx2.toFixed(1)}" y="${cy2.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" fill="rgba(20,100,90,.9)" font-size="9" pointer-events="none">✓</text>`;
          }
          o+=`</g>`;
          return; // skip normal rendering
        }
      }

      // ── Normal (non-animating) rendering ───────────────────────────────────────
      const dim=inEditor&&floor!==fi?0.22:1;
      const bl=ip(c,r,fzB),br=ip(c+1,r,fzB),bf=ip(c+1,r+1,fzB),bb=ip(c,r+1,fzB);
      const tl=ip(c,r,fzT),tr=ip(c+1,r,fzT),tf=ip(c+1,r+1,fzT),tb=ip(c,r+1,fzT);

      // Color tiers
      let topFill, xFill, yFill, borderCol;
      // Effective material: live preview overrides committed material while picker is open
      const effMat=(bk?.floor2&&matPickerPreview)?matPickerPreview:(bk?.material||null);
      if(rnd){
        // ── Rendered mode: floor-specific glass — amber / blue / mint per floor
        if(bk&&bk.status==='customized'){
          if(fi===2&&effMat&&F2_MATERIALS[effMat]){
            // Floor 2: SVG texture pattern fills
            yFill=`url(#pw-${effMat})`;xFill=`url(#pw-${effMat})`;topFill=`url(#pr-${effMat})`;
            borderCol=F2_MATERIALS[effMat].bdr;
          } else {
            // Other booked cell: bright teal glass
            topFill='rgba(105,232,215,.48)'; xFill='rgba(44,168,155,.65)'; yFill='rgba(68,190,175,.58)'; borderCol='rgba(145,242,228,.96)';
          }
        } else {
          const g=GLASS[fi];
          topFill=g.top; xFill=g.xf; yFill=g.yf; borderCol=g.bdr;
        }
      } else if(bk&&bk.status==='customized'){
        topFill=bk.color+'bb'; xFill=bk.color+'55'; yFill=bk.color+'44'; borderCol=bk.color;
      } else if(inEditor&&floor===fi){
        topFill=fcfg.isoAddTop; xFill=fcfg.isoAddXf; yFill=fcfg.isoAddYf; borderCol=fcfg.addBorder;
      } else if(fi===2){
        const isGrey2=(c+r)%2===0;
        topFill=isGrey2?'rgba(100,100,100,.72)':'rgba(248,248,248,.82)';
        xFill  =isGrey2?'rgba(72,72,72,.76)' :'rgba(200,200,200,.6)';
        yFill  =isGrey2?'rgba(50,50,50,.80)' :'rgba(170,170,170,.65)';
        borderCol='rgba(170,0,0,.5)';
      } else {
        topFill='rgba(28,42,68,.52)'; xFill='rgba(18,28,46,.58)'; yFill='rgba(11,18,32,.64)'; borderCol='rgba(59,130,197,.28)';
      }

      // Drop shadow on ground in rendered mode
      if(rnd){
        const sh=0.14;
        o+=`<polygon points="${pts([ip(c+sh,r+sh,fzB),ip(c+1+sh,r+sh,fzB),ip(c+1+sh,r+1+sh,fzB),ip(c+sh,r+1+sh,fzB)])}" fill="rgba(0,0,0,.10)"/>`;
      }
      const isGlass=rnd; // all cells are glass in rendered mode
      o+=`<g opacity="${dim}" onclick="clickBookable(${c},${r},event)" style="cursor:pointer"
        onmouseenter="hov('[${c},${r}] ${fcfg.name} · ${bk?bk.status:'available'}')" onmouseleave="hov('')">`;
      o+=`<polygon points="${pts([bl,bb,tb,tl])}" fill="${yFill}" ${isGlass?`stroke="${borderCol}" stroke-width=".7"`:!rnd?'stroke="rgba(0,0,0,.25)" stroke-width=".6"':''}/>`;
      o+=`<polygon points="${pts([br,bf,tf,tr])}" fill="${xFill}" ${isGlass?`stroke="${borderCol}" stroke-width=".7"`:!rnd?'stroke="rgba(0,0,0,.25)" stroke-width=".6"':''}/>`;
      o+=rnd
        ?`<polygon points="${pts([bl,br,bf,bb])}" fill="rgba(0,0,0,.45)" stroke="${borderCol}" stroke-width=".4"/>`
        :`<polygon points="${pts([bl,br,bf,bb])}" fill="rgba(4,10,20,.75)" stroke="rgba(59,130,197,.1)" stroke-width=".3"/>`;
      const dashTop=inEditor&&floor===fi&&!bk?' stroke-dasharray="8,4"':'';
      o+=`<polygon points="${pts([tl,tr,tf,tb])}" fill="${topFill}" ${isGlass?`stroke="${borderCol}" stroke-width="1.3"`:!rnd?`stroke="${borderCol}" stroke-width="${inEditor&&floor===fi?1.5:.8}"${dashTop}`:''}/>`;
      // Directional lighting overlays for material pattern cells
      if(rnd&&fi===2&&bk?.status==='customized'&&effMat&&F2_MATERIALS[effMat]){
        const ms=F2_MATERIALS[effMat];
        o+=`<polygon points="${pts([bl,bb,tb,tl])}" fill="rgba(0,0,0,${ms.ls})" pointer-events="none"/>`;
        o+=`<polygon points="${pts([br,bf,tf,tr])}" fill="rgba(0,0,0,${ms.rs})" pointer-events="none"/>`;
        o+=`<polygon points="${pts([tl,tr,tf,tb])}" fill="rgba(255,255,255,${ms.tl})" pointer-events="none"/>`;
      }
      if(isGlass){
        // Specular highlight — bright triangle at top-lit corner
        const mx=(tl[0]+tr[0]+tf[0]+tb[0])/4, my=(tl[1]+tr[1]+tf[1]+tb[1])/4;
        const hlx=(tl[0]+tr[0])/2, hly=(tl[1]+tr[1])/2;
        const hlbx=(tl[0]+tb[0])/2, hlby=(tl[1]+tb[1])/2;
        o+=`<polygon points="${tl[0].toFixed(1)},${tl[1].toFixed(1)} ${hlx.toFixed(1)},${hly.toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)} ${hlbx.toFixed(1)},${hlby.toFixed(1)}" fill="rgba(255,255,255,.28)" pointer-events="none"/>`;
      }
      if(bk&&bk.status==='customized'){
        const cx=(tl[0]+tr[0]+tf[0]+tb[0])/4, cy=(tl[1]+tr[1]+tf[1]+tb[1])/4;
        if(fi===0&&inEditor&&bk.icon){
          const cr=Math.hypot(tr[0]-tl[0],tr[1]-tl[1])*.48;
          const cxs=cx.toFixed(1), cys=cy.toFixed(1);
          // Layered static glow halos — wide soft cloud
          o+=`<circle cx="${cxs}" cy="${cys}" r="${(cr*2.2).toFixed(1)}" fill="${bk.color}16" pointer-events="none"/>`;
          o+=`<circle cx="${cxs}" cy="${cys}" r="${(cr*1.4).toFixed(1)}" fill="${bk.color}30" pointer-events="none"/>`;
          // Bright core disc with hard border
          o+=`<circle cx="${cxs}" cy="${cys}" r="${(cr*.72).toFixed(1)}" fill="${bk.color}60" stroke="${bk.color}" stroke-width="2" pointer-events="none"/>`;
          // Three pulsing rings — start small, bloom outward, full-opacity strokes
          o+=`<circle cx="${cxs}" cy="${cys}" r="${(cr*.25).toFixed(1)}" fill="none" stroke="${bk.color}" stroke-width="2.2" pointer-events="none"><animate attributeName="r" values="${(cr*.25).toFixed(1)};${(cr*1.6).toFixed(1)}" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/></circle>`;
          o+=`<circle cx="${cxs}" cy="${cys}" r="${(cr*.25).toFixed(1)}" fill="none" stroke="${bk.color}" stroke-width="1.6" pointer-events="none"><animate attributeName="r" values="${(cr*.25).toFixed(1)};${(cr*2.1).toFixed(1)}" dur="1.6s" begin="0.42s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.85;0" dur="1.6s" begin="0.42s" repeatCount="indefinite"/></circle>`;
          o+=`<circle cx="${cxs}" cy="${cys}" r="${(cr*.25).toFixed(1)}" fill="none" stroke="${bk.color}cc" stroke-width="1" pointer-events="none"><animate attributeName="r" values="${(cr*.25).toFixed(1)};${(cr*2.6).toFixed(1)}" dur="1.6s" begin="0.84s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.65;0" dur="1.6s" begin="0.84s" repeatCount="indefinite"/></circle>`;
          // Large icon with double-blur glow filter
          o+=`<text x="${cxs}" y="${cys}" text-anchor="middle" dominant-baseline="middle" font-size="${Math.round(cr*2.6)}" pointer-events="none" filter="url(#isoIconGlow)">${bk.icon}</text>`;
        } else {
          o+=`<text x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" fill="${rnd?'rgba(20,100,90,.9)':'white'}" font-size="9" pointer-events="none">✓</text>`;
        }
      } else if(inEditor&&floor===fi){
        const cx=(tl[0]+tr[0]+tf[0]+tb[0])/4, cy=(tl[1]+tr[1]+tf[1]+tb[1])/4;
        o+=`<text x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" fill="${fcfg.addIcon}" font-size="10" font-weight="700" pointer-events="none">+</text>`;
      }
      // ── Material surface detail for floor 2 in rendered mode ─────────────────
      if(rnd&&fi===2&&bk?.status==='customized'&&effMat&&F2_MATERIALS[effMat]){
        const m=F2_MATERIALS[effMat];
        const lp=(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
        if(m.panelType==='seam'){
          // Tensile fabric: catenary seams from roof centre to edge midpoints
          const rc=(tl[0]+tr[0]+tf[0]+tb[0])/4, rcy=(tl[1]+tr[1]+tf[1]+tb[1])/4;
          [[tl,tr],[tr,tf],[tf,tb],[tb,tl]].forEach(([a,b])=>{
            const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
            o+=`<line x1="${rc.toFixed(1)}" y1="${rcy.toFixed(1)}" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="${m.bdr}99" stroke-width="1.1" pointer-events="none"/>`;
          });
          // Mid-height seam on each wall
          [[bl,bb,tl,tb],[br,bf,tr,tf]].forEach(([ba,bb2,ta,tb2])=>{
            o+=`<line x1="${lp(ba,ta,.5)[0].toFixed(1)}" y1="${lp(ba,ta,.5)[1].toFixed(1)}" x2="${lp(bb2,tb2,.5)[0].toFixed(1)}" y2="${lp(bb2,tb2,.5)[1].toFixed(1)}" stroke="${m.bdr}77" stroke-width=".9" pointer-events="none"/>`;
          });
        } else if(m.panelType==='joints'){
          // Insulated panel: vertical joints at ⅓ intervals on walls + grid on roof
          [1/3,2/3].forEach(t=>{
            o+=`<line x1="${lp(bl,bb,t)[0].toFixed(1)}" y1="${lp(bl,bb,t)[1].toFixed(1)}" x2="${lp(tl,tb,t)[0].toFixed(1)}" y2="${lp(tl,tb,t)[1].toFixed(1)}" stroke="rgba(0,0,0,.30)" stroke-width=".8" pointer-events="none"/>`;
            o+=`<line x1="${lp(br,bf,t)[0].toFixed(1)}" y1="${lp(br,bf,t)[1].toFixed(1)}" x2="${lp(tr,tf,t)[0].toFixed(1)}" y2="${lp(tr,tf,t)[1].toFixed(1)}" stroke="rgba(0,0,0,.30)" stroke-width=".8" pointer-events="none"/>`;
          });
          // Roof grid lines
          o+=`<line x1="${lp(tl,tr,.5)[0].toFixed(1)}" y1="${lp(tl,tr,.5)[1].toFixed(1)}" x2="${lp(tb,tf,.5)[0].toFixed(1)}" y2="${lp(tb,tf,.5)[1].toFixed(1)}" stroke="rgba(0,0,0,.22)" stroke-width=".7" pointer-events="none"/>`;
          o+=`<line x1="${lp(tl,tb,.5)[0].toFixed(1)}" y1="${lp(tl,tb,.5)[1].toFixed(1)}" x2="${lp(tr,tf,.5)[0].toFixed(1)}" y2="${lp(tr,tf,.5)[1].toFixed(1)}" stroke="rgba(0,0,0,.22)" stroke-width=".7" pointer-events="none"/>`;
        } else if(m.panelType==='cushion'){
          // ETFE: framed inner panel with raised-center highlight
          const ins=0.16;
          o+=`<polygon points="${pts([ip(c+ins,r+ins,fzT),ip(c+1-ins,r+ins,fzT),ip(c+1-ins,r+1-ins,fzT),ip(c+ins,r+1-ins,fzT)])}" fill="rgba(255,255,255,.32)" stroke="${m.bdr}88" stroke-width=".7" pointer-events="none"/>`;
          // Wall inner highlight bands
          [[c,r,c+1,r],[c,r+1,c+1,r+1],[c,r,c,r+1],[c+1,r,c+1,r+1]].forEach(([x1,y1,x2,y2])=>{
            o+=`<line x1="${ip(x1+((x2-x1)*ins),y1+((y2-y1)*ins),fzB+FH*.1)[0].toFixed(1)}" y1="${ip(x1+((x2-x1)*ins),y1+((y2-y1)*ins),fzB+FH*.1)[1].toFixed(1)}" x2="${ip(x1+((x2-x1)*ins),y1+((y2-y1)*ins),fzT-FH*.1)[0].toFixed(1)}" y2="${ip(x1+((x2-x1)*ins),y1+((y2-y1)*ins),fzT-FH*.1)[1].toFixed(1)}" stroke="rgba(255,255,255,.28)" stroke-width="1.4" pointer-events="none"/>`;
          });
        }
        // Material icon on roof face (all material types)
        const mcx=(tl[0]+tr[0]+tf[0]+tb[0])/4, mcy=(tl[1]+tr[1]+tf[1]+tb[1])/4;
        o+=`<text x="${mcx.toFixed(1)}" y="${mcy.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="11" pointer-events="none" opacity=".85">${m.icon}</text>`;
      }
      o+=`</g>`;
    }
    else if(item.kind==='placed'){
      const {el}=item;
      const fcfg=FCFG[el.floor];
      const fzB=el.floor*FH, fzT=fzB+FH;
      const dim=inEditor&&floor!==el.floor?0.25:1;
      const sel=selectedEl===el.id;
      const bl=ip(el.c,el.r,fzB),br=ip(el.c+1,el.r,fzB),bf=ip(el.c+1,el.r+1,fzB),bb=ip(el.c,el.r+1,fzB);
      const tl=ip(el.c,el.r,fzT),tr=ip(el.c+1,el.r,fzT),tf=ip(el.c+1,el.r+1,fzT),tb=ip(el.c,el.r+1,fzT);
      o+=`<g opacity="${dim}" onclick="clickEl('${el.id}',event)" style="cursor:pointer"
        onmouseenter="hov('${el.label} [${el.c},${el.r}] ${fcfg.name}')" onmouseleave="hov('')">`;
      if(rnd){
        const gp2=GLASS[el.floor];
        o+=`<polygon points="${pts([bl,bb,tb,tl])}" fill="${gp2.yf}" stroke="${gp2.bdr}" stroke-width=".8"/>`;
        o+=`<polygon points="${pts([br,bf,tf,tr])}" fill="${gp2.xf}" stroke="${gp2.bdr}" stroke-width=".8"/>`;
        o+=`<polygon points="${pts([bl,br,bf,bb])}" fill="rgba(0,0,0,.45)"/>`;
        o+=`<polygon points="${pts([tl,tr,tf,tb])}" fill="${gp2.top}" stroke="${gp2.bdr}" stroke-width="1.3"/>`;
      } else {
        o+=`<polygon points="${pts([bl,bb,tb,tl])}" fill="${fcfg.isoYf}" stroke="rgba(0,0,0,.3)" stroke-width=".7"/>`;
        o+=`<polygon points="${pts([br,bf,tf,tr])}" fill="${fcfg.isoXf}" stroke="rgba(0,0,0,.3)" stroke-width=".7"/>`;
        o+=`<polygon points="${pts([bl,br,bf,bb])}" fill="rgba(4,10,22,.8)"/>`;
        o+=`<polygon points="${pts([tl,tr,tf,tb])}" fill="${sel?'rgba(255,255,255,.8)':fcfg.fixedBg}" stroke="${sel?'white':fcfg.col}" stroke-width="${sel?2.5:1.2}"/>`;
      }
      const cx=(tl[0]+tr[0]+tf[0]+tb[0])/4, cy=(tl[1]+tr[1]+tf[1]+tb[1])/4;
      o+=`<text x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="14" pointer-events="none">${ETYPES[el.type]?.icon||''}</text>`;
      o+=`</g>`;
    }
    else if(item.kind==='column'){
      const {gc,gr,fi}=item;
      const fzB=fi*FH, fzT=fzB+FH;
      const dim=inEditor&&floor!==fi?0.28:1;
      const bot=ip(gc,gr,fzB), top2=ip(gc,gr,fzT);
      const sw=Math.max(2.5,Math.min(8,3.8*isoZoom));
      o+=`<g opacity="${dim}" pointer-events="none">`;
      // Cylinder shaft — thick rounded stroke
      o+=`<line x1="${bot[0].toFixed(1)}" y1="${bot[1].toFixed(1)}" x2="${top2[0].toFixed(1)}" y2="${top2[1].toFixed(1)}" stroke="#8B0C0C" stroke-width="${sw}" stroke-linecap="round"/>`;
      // Glossy highlight strip — simulates cylindrical curvature
      o+=`<line x1="${bot[0].toFixed(1)}" y1="${bot[1].toFixed(1)}" x2="${top2[0].toFixed(1)}" y2="${top2[1].toFixed(1)}" stroke="rgba(255,155,155,.42)" stroke-width="${(sw*.36).toFixed(1)}" stroke-linecap="round"/>`;
      // Top cap ellipse (column head)
      const rEll=(sw*.88).toFixed(1), ryEll=(sw*.36).toFixed(1);
      o+=`<ellipse cx="${top2[0].toFixed(1)}" cy="${top2[1].toFixed(1)}" rx="${rEll}" ry="${ryEll}" fill="#E82222" stroke="#FF4444" stroke-width=".8"/>`;
      // Base cap ellipse (column foot)
      o+=`<ellipse cx="${bot[0].toFixed(1)}" cy="${bot[1].toFixed(1)}" rx="${rEll}" ry="${ryEll}" fill="#771111" stroke="#AA1111" stroke-width=".5"/>`;
      o+=`</g>`;
    }
  });

  // ── Fixed core 3D boxes — floor-specific extents from floor plan images ──────
  // F0: 3×3 kitchen center · F1: full 5×5 stay rooms · F2: no core (all bookable)
  const ISO_CORES=[{CC:1,CR:1,CW:2,CH:2},{CC:0,CR:0,CW:5,CH:5},null];
  [0,1,2].forEach(fi=>{
    if(!layerVis[fi]) return;
    if(!ISO_CORES[fi]) return; // floor 2 has no fixed core block
    const {CC,CR,CW,CH}=ISO_CORES[fi];
    const fcfg=FCFG[fi];
    const fzB=fi*FH, fzT=fzB+FH;
    const dim=inEditor&&floor!==fi?0.28:1;
    const bl=ip(CC,CR,fzB),br=ip(CC+CW,CR,fzB),bf=ip(CC+CW,CR+CH,fzB),bb=ip(CC,CR+CH,fzB);
    const tl=ip(CC,CR,fzT),tr=ip(CC+CW,CR,fzT),tf=ip(CC+CW,CR+CH,fzT),tb=ip(CC,CR+CH,fzT);
    // Drop shadow on ground in rendered mode
    if(rnd){
      const sh=0.14;
      const sbl2=ip(CC+sh,CR+sh,fzB),sbr2=ip(CC+CW+sh,CR+sh,fzB);
      const sbf2=ip(CC+CW+sh,CR+CH+sh,fzB),sbb2=ip(CC+sh,CR+CH+sh,fzB);
      o+=`<polygon points="${pts([sbl2,sbr2,sbf2,sbb2])}" fill="rgba(0,0,0,.12)"/>`;
    }
    o+=`<g opacity="${dim}">`;
    if(rnd){
      // Rendered: floor-specific glass — core blocks match their floor tint
      const g=GLASS[fi];
      o+=`<polygon points="${pts([bl,bb,tb,tl])}" fill="${g.yf}" stroke="${g.bdr}" stroke-width=".9"/>`;
      o+=`<polygon points="${pts([br,bf,tf,tr])}" fill="${g.xf}" stroke="${g.bdr}" stroke-width=".9"/>`;
      o+=`<polygon points="${pts([bl,br,bf,bb])}" fill="rgba(0,0,0,.5)" stroke="${g.bdr}" stroke-width=".5"/>`;
      o+=`<polygon points="${pts([tl,tr,tf,tb])}" fill="${g.top}" stroke="${g.bdr}" stroke-width="1.5"/>`;
      // Specular highlight top-lit corner
      const gmx=(tl[0]+tr[0]+tf[0]+tb[0])/4,gmy=(tl[1]+tr[1]+tf[1]+tb[1])/4;
      const ghlx=(tl[0]+tr[0])/2,ghly=(tl[1]+tr[1])/2,ghlbx=(tl[0]+tb[0])/2,ghlby=(tl[1]+tb[1])/2;
      o+=`<polygon points="${tl[0].toFixed(1)},${tl[1].toFixed(1)} ${ghlx.toFixed(1)},${ghly.toFixed(1)} ${gmx.toFixed(1)},${gmy.toFixed(1)} ${ghlbx.toFixed(1)},${ghlby.toFixed(1)}" fill="${g.spec}" pointer-events="none"/>`;
    } else {
      // Editor: floor-colour tinted faces
      o+=`<polygon points="${pts([bl,bb,tb,tl])}" fill="${fcfg.isoYf}" stroke="rgba(0,0,0,.4)" stroke-width="1.2"/>`;
      o+=`<polygon points="${pts([br,bf,tf,tr])}" fill="${fcfg.isoXf}" stroke="rgba(0,0,0,.4)" stroke-width="1.2"/>`;
      o+=`<polygon points="${pts([bl,br,bf,bb])}" fill="rgba(4,10,22,.85)"/>`;
      o+=`<polygon points="${pts([tl,tr,tf,tb])}" fill="${fcfg.isoTop}" stroke="${fcfg.fixedBdr}" stroke-width="${inEditor&&floor===fi?2.5:1.5}"/>`;
    }

    // Top face sub-grid overlay (editor mode only — rendered mode stays clean)
    if(!rnd&&(fi===1||fi===2)){
      const SUBDIV=5;
      for(let gr=0;gr<SUBDIV;gr++){
        for(let gc=0;gc<SUBDIV;gc++){
          const t0=gr/SUBDIV, t1=(gr+1)/SUBDIV;
          const s0=gc/SUBDIV, s1=(gc+1)/SUBDIV;
          function lerp2(t,s){
            const top=[tl[0]+(tr[0]-tl[0])*s, tl[1]+(tr[1]-tl[1])*s];
            const bot=[tb[0]+(tf[0]-tb[0])*s, tb[1]+(tf[1]-tb[1])*s];
            return [top[0]+(bot[0]-top[0])*t, top[1]+(bot[1]-top[1])*t];
          }
          const p00=lerp2(t0,s0), p10=lerp2(t1,s0), p11=lerp2(t1,s1), p01=lerp2(t0,s1);
          let cellFill, cellStroke;
          if(fi===1){
            cellFill='rgba(255,255,255,.88)'; cellStroke='rgba(180,0,0,.55)';
          } else {
            cellFill=(gr+gc)%2===0?'rgba(110,110,110,.78)':'rgba(255,255,255,.88)'; cellStroke='rgba(180,0,0,.55)';
          }
          o+=`<polygon points="${pts([p00,p01,p11,p10])}" fill="${cellFill}" stroke="${cellStroke}" stroke-width=".5"/>`;
        }
      }
    }

    const cx=(tl[0]+tr[0]+tf[0]+tb[0])/4, cy=(tl[1]+tr[1]+tf[1]+tb[1])/4;
    if(!rnd) o+=`<text x="${cx.toFixed(1)}" y="${(cy-6).toFixed(1)}" text-anchor="middle" fill="${fcfg.addLabel}" font-size="9" font-family="monospace" font-weight="700" pointer-events="none">${fi===0?'Kitchen':fi===1?'Stay Rooms':'Deployable'}</text>`;
    o+=`</g>`;
  });

  // Floor level markers (editor mode only — rendered mode stays clean)
  const totalH=NF*FH;
  if(!rnd){
    const b0=ip(0,0,0),bT=ip(0,0,totalH);
    o+=`<line x1="${(b0[0]-10).toFixed(1)}" y1="${b0[1].toFixed(1)}" x2="${(bT[0]-10).toFixed(1)}" y2="${bT[1].toFixed(1)}" stroke="rgba(59,130,197,.35)" stroke-width="1" stroke-dasharray="3,2"/>`;
    FL.forEach((lbl,fi)=>{
      const fp=ip(0,0,fi*FH);
      const act=fi===floor;
      const fcol=act?FCFG[fi].col:'rgba(59,130,197,.35)';
      o+=`<line x1="${(fp[0]-18).toFixed(1)}" y1="${fp[1].toFixed(1)}" x2="${(fp[0]-4).toFixed(1)}" y2="${fp[1].toFixed(1)}" stroke="${fcol}" stroke-width="${act?1.8:1}"/>`;
      o+=`<text x="${(fp[0]-21).toFixed(1)}" y="${fp[1].toFixed(1)}" text-anchor="end" dominant-baseline="middle" fill="${fcol}" font-size="9" font-family="monospace" font-weight="${act?700:400}">${lbl}</text>`;
    });
    const bT2=ip(0,0,totalH),b02=ip(0,0,0);
    o+=`<text x="${(bT2[0]-12).toFixed(1)}" y="${((b02[1]+bT2[1])/2).toFixed(1)}" text-anchor="end" dominant-baseline="middle" fill="rgba(59,130,197,.55)" font-size="8" font-family="monospace">${totalH}m</text>`;
    o+=`<text x="${W-12}" y="${H-12}" text-anchor="end" fill="rgba(255,255,255,.1)" font-size="8" font-family="monospace">SCROLL zoom · DRAG rotate · CTRL+DRAG pan</text>`;
    o+=`<text x="14" y="${H-12}" fill="rgba(59,130,197,.22)" font-size="8" font-family="monospace">G+2 · 5m cell · 4m/floor · ${totalH}m total</text>`;
  }
  if(Object.keys(roofPanels).length>0) o=renderWaveRoof(o);
  // Live preview badge — shown in iso when material picker is open and hovering
  if(matPickerPreview&&F2_MATERIALS[matPickerPreview]){
    const pm=F2_MATERIALS[matPickerPreview];
    o+=`<rect x="${W-178}" y="10" width="168" height="28" rx="7" fill="rgba(8,18,38,.78)" stroke="rgba(59,130,197,.5)" stroke-width="1"/>`;
    o+=`<text x="${W-94}" y="28" text-anchor="middle" fill="rgba(130,200,255,.9)" font-size="12" font-family="monospace" font-weight="600">PREVIEW · ${pm.label}</text>`;
  }
  svg.innerHTML=o;
}


// ── Deployable Wave Membrane Roof (Floor 2) ───────────────────────────────────
function domeZ(u,v,animP){
  // Per-cell inflated dome: peak at center (u=0.5,v=0.5), zero at all four edges
  // Produces deep V-valleys between adjacent cells — ETFE/PTFE cushion panel geometry
  const fzT=NF*FH, baseH=0.28, inflateH=2.7;
  return fzT + baseH + inflateH*Math.sin(u*Math.PI)*Math.sin(v*Math.PI)*animP;
}

function roofDeployAll(){
  Object.keys(bookings).forEach(k=>{ if(bookings[k].floor2&&!roofPanels.hasOwnProperty(k)) roofPanels[k]=performance.now(); });
  toast('Deploying all roof panels…');
  renderSidebars(); render();
}
function roofRetractAll(){
  roofPanels={}; roofLightColor=null;
  renderSidebars(); render();
}
function toggleRoofPanel(key){
  if(roofPanels.hasOwnProperty(key)){
    delete roofPanels[key];
    if(Object.keys(roofPanels).length===0) roofLightColor=null;
  } else {
    if(bookings[key]&&bookings[key].floor2) roofPanels[key]=performance.now();
  }
  renderSidebars(); render();
}

const ROOF_LIGHTS=[
  {id:'off',    label:'Off',         col:null,          hex:'rgba(28,38,58,.90)'},
  {id:'warm',   label:'Warm White',  col:'255,225,160', hex:'rgba(255,225,160,.85)'},
  {id:'cyan',   label:'Cyan',        col:'80,220,255',  hex:'rgba(80,220,255,.85)'},
  {id:'green',  label:'Neon Green',  col:'60,255,140',  hex:'rgba(60,255,140,.85)'},
  {id:'amber',  label:'Amber',       col:'255,155,30',  hex:'rgba(255,155,30,.85)'},
  {id:'pink',   label:'Pink',        col:'255,80,200',  hex:'rgba(255,80,200,.85)'},
  {id:'violet', label:'Violet',      col:'160,80,255',  hex:'rgba(160,80,255,.85)'},
];
function setRoofLight(col){roofLightColor=col||null;renderSidebars();render();}
function roofSidebarHtml(){
  const f2keys=Object.keys(bookings).filter(k=>bookings[k].floor2);
  if(!f2keys.length) return '';
  const anyOn=Object.keys(roofPanels).length>0;

  const cellBtns=f2keys.map(function(key){
    const p=key.split(','); const col=+p[0]+1, row=+p[1]+1;
    const on=roofPanels.hasOwnProperty(key);
    const bg  =on?'rgba(80,160,255,.14)':'rgba(255,255,255,.03)';
    const bdr =on?'rgba(80,160,255,.55)':'rgba(255,255,255,.09)';
    const clr =on?'rgba(140,210,255,.95)':'rgba(255,255,255,.30)';
    const icon=on?'&#9650;':'&#9660;';
    const tip =on?'Close panel':'Open panel';
    return '<div onclick="toggleRoofPanel(\''+ key +'\')" title="'+tip+'" style="'
      +'display:flex;justify-content:space-between;align-items:center;'
      +'padding:6px 10px;border-radius:6px;cursor:pointer;margin-bottom:4px;'
      +'background:'+bg+';border:1px solid '+bdr+';transition:all .18s;">'
      +'<span style="font-size:12px;font-family:monospace;color:'+clr+'">Col'+col+' · Row'+row+'</span>'
      +'<span style="font-size:13px;color:'+clr+'">'+icon+'</span>'

  }).join('');

  let lightHtml='';
  if(anyOn){
    const sw=ROOF_LIGHTS.map(function(l){
      const act=roofLightColor===l.col;
      const arg=l.col?"'" +l.col+"'":'null';

      const sh=act&&l.col?'0 0 16px rgba('+l.col+',.90)':'none';
      return '<div onclick="setRoofLight('+arg+')" title="'+l.label+'" style="'
        +'width:27px;height:27px;border-radius:50%;cursor:pointer;'
        +'background:'+l.hex+';border:2px solid '+bd+';'

    }).join('');
    const al=ROOF_LIGHTS.find(function(l){return l.col===roofLightColor;});
    const st=roofLightColor
      ?'<div style="font-size:12px;font-family:monospace;margin-bottom:8px;padding:5px 8px;border-radius:5px;background:rgba('+roofLightColor+',.12);border:1px solid rgba('+roofLightColor+',.35);color:rgba('+roofLightColor+',.95)">● '+(al?al.label:'Custom')+' · Active</div>'
      :'<div style="font-size:12px;font-family:monospace;margin-bottom:8px;color:rgba(255,255,255,.22)">Select a colour</div>';
    lightHtml='<div style="font-size:11px;color:rgba(255,255,255,.28);font-family:monospace;margin-top:12px;margin-bottom:7px;text-transform:uppercase;letter-spacing:.08em">Ambient Lighting</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">'+sw+'</div>'+st;
  }

  return '<div class="s-sec">'
    +'<div class="s-ttl">Membrane Roof</div>'
    +'<div style="font-size:13px;color:rgba(200,220,255,.55);font-family:monospace;margin-bottom:10px;line-height:1.6">Floor +2 · PTFE panels</div>'
    +'<div style="display:flex;gap:6px;margin-bottom:10px;">'
    +'<button onclick="roofDeployAll()" style="flex:1;padding:7px 0;border-radius:6px;border:1px solid rgba(80,160,255,.35);background:rgba(80,160,255,.10);color:rgba(130,200,255,.9);font-size:12px;font-family:monospace;cursor:pointer;">&#9650; Open All</button>'
    +'<button onclick="roofRetractAll()" style="flex:1;padding:7px 0;border-radius:6px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);color:rgba(255,255,255,.35);font-size:12px;font-family:monospace;cursor:pointer;">&#9660; Close All</button>'
    +'</div>'
    +'<div style="display:flex;flex-direction:column;">'+cellBtns+'</div>'

    +'</div>';
}

function renderWaveRoof(o){
  const now=performance.now();

  // Build per-cell list with individual animation progress
  const cells=Object.keys(roofPanels).map(function(key){
    const p=key.split(','); const c=+p[0], r=+p[1];
    const aStart=roofPanels[key];
    const elapsed=aStart!==null ? now-aStart : Infinity;
    const rawP=Math.min(1, elapsed/1500);
    const animP=1-Math.pow(1-rawP,3);
    if(rawP<1) requestAnimationFrame(()=>render());
    else roofPanels[key]=null;
    return {c,r,animP};
  });
  if(!cells.length) return o;

  const NU=10, NV=8;

  if(roofLightColor){
    o+='<defs><filter id="rf-glow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  }

  cells.forEach(function(cell){
    const sh=0.14;
    const s=[ip(cell.c+sh,cell.r+sh,NF*FH),ip(cell.c+1+sh,cell.r+sh,NF*FH),ip(cell.c+1+sh,cell.r+1+sh,NF*FH),ip(cell.c+sh,cell.r+1+sh,NF*FH)];
    o+=`<polygon points="${pts(s)}" fill="rgba(0,0,0,.13)" pointer-events="none"/>`;
  });

  const sorted=[...cells].sort((a,b)=>a.r!==b.r?a.r-b.r:a.c-b.c);

  sorted.forEach(function(cell){
    const c=cell.c, r=cell.r, animP=cell.animP;
    const mesh=[];
    for(let j=0;j<=NV;j++){
      mesh[j]=[];
      for(let i=0;i<=NU;i++){
        const u=i/NU, v=j/NV;
        mesh[j][i]=ip(c+u, r+v, domeZ(u,v,animP));
      }
    }

    for(let j=0;j<NV;j++){
      const vC=(j+0.5)/NV;
      for(let i=0;i<NU;i++){
        const uC=(i+0.5)/NU;
        const dV=Math.sin(uC*Math.PI)*Math.sin(vC*Math.PI);
        const dL=0.50+0.15*(0.5-uC)+0.15*(0.5-vC);
        const sh=0.18+dV*0.60+dL*0.22;
        const rv=Math.min(255,Math.round(148+107*sh));
        const gv=Math.min(255,Math.round(162+ 93*sh));
        const bv=Math.min(255,Math.round(200+ 55*sh));
        const fill=`rgb(${rv},${gv},${bv})`;
        const p00=mesh[j][i],p10=mesh[j][i+1],p01=mesh[j+1][i],p11=mesh[j+1][i+1];
        const d=`M ${p00[0].toFixed(1)},${p00[1].toFixed(1)} L ${p10[0].toFixed(1)},${p10[1].toFixed(1)} L ${p11[0].toFixed(1)},${p11[1].toFixed(1)} L ${p01[0].toFixed(1)},${p01[1].toFixed(1)} Z`;
        o+=`<path d="${d}" fill="${fill}" stroke="${fill}" stroke-width="0.35" pointer-events="none"/>`;
      }
    }

    if(roofLightColor){
      const rgb=roofLightColor;
      for(let j=0;j<NV;j++){
        const vC=(j+0.5)/NV;
        for(let i=0;i<NU;i++){
          const uC=(i+0.5)/NU;
          const intensity=Math.sin(uC*Math.PI)*Math.sin(vC*Math.PI);
          const alpha=(0.10+intensity*0.44).toFixed(2);
          const p00=mesh[j][i],p10=mesh[j][i+1],p01=mesh[j+1][i],p11=mesh[j+1][i+1];
          const d=`M ${p00[0].toFixed(1)},${p00[1].toFixed(1)} L ${p10[0].toFixed(1)},${p10[1].toFixed(1)} L ${p11[0].toFixed(1)},${p11[1].toFixed(1)} L ${p01[0].toFixed(1)},${p01[1].toFixed(1)} Z`;
          o+=`<path d="${d}" fill="rgba(${rgb},${alpha})" pointer-events="none"/>`;
        }
      }
      const pk=ip(c+0.5, r+0.5, domeZ(0.5,0.5,animP));
      o+=`<ellipse cx="${pk[0].toFixed(1)}" cy="${pk[1].toFixed(1)}" rx="16" ry="10" fill="rgba(${rgb},.62)" filter="url(#rf-glow)" pointer-events="none"/>`;
      const fc=ip(c+0.5, r+0.5, NF*FH);
      o+=`<ellipse cx="${fc[0].toFixed(1)}" cy="${fc[1].toFixed(1)}" rx="25" ry="16" fill="rgba(${rgb},.22)" filter="url(#rf-glow)" pointer-events="none"/>`;
    }

    const rc=roofLightColor?`rgba(${roofLightColor},.88)`:"rgba(100,130,180,.75)";
    for(const jE of [0,NV]){
      let rl=`M ${mesh[jE][0][0].toFixed(1)},${mesh[jE][0][1].toFixed(1)}`;
      for(let i=1;i<=NU;i++) rl+=` L ${mesh[jE][i][0].toFixed(1)},${mesh[jE][i][1].toFixed(1)}`;
      o+=`<path d="${rl}" fill="none" stroke="${rc}" stroke-width="0.9" pointer-events="none"/>`;
    }
    for(const iE of [0,NU]){
      let rl=`M ${mesh[0][iE][0].toFixed(1)},${mesh[0][iE][1].toFixed(1)}`;
      for(let j=1;j<=NV;j++) rl+=` L ${mesh[j][iE][0].toFixed(1)},${mesh[j][iE][1].toFixed(1)}`;
      o+=`<path d="${rl}" fill="none" stroke="${rc}" stroke-width="0.9" pointer-events="none"/>`;
    }

    const pkJ=Math.round(NV*0.5);
    let pk2=`M ${mesh[pkJ][0][0].toFixed(1)},${mesh[pkJ][0][1].toFixed(1)}`;
    for(let i=1;i<=NU;i++) pk2+=` L ${mesh[pkJ][i][0].toFixed(1)},${mesh[pkJ][i][1].toFixed(1)}`;
    o+=`<path d="${pk2}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2" stroke-linecap="round" pointer-events="none"/>`;

    const fc2=roofLightColor?`rgba(${roofLightColor},.92)`:"rgba(80,110,165,.85)";
    [[0,0],[0,NU],[NV,0],[NV,NU]].forEach(([jj,ii])=>{
      const pt=mesh[jj][ii];
      o+=`<circle cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="2.4" fill="${fc2}" stroke="rgba(210,225,255,.45)" stroke-width="0.5" pointer-events="none"/>`;
    });
  });

  return o;
}
